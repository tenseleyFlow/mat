name: CI

on:
  push:
    branches: [trunk, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install clang-format (pinned for reproducible formatting)
        run: pipx install clang-format==19.1.7
      - name: Check formatting
        run: clang-format --dry-run -Werror src/*.c src/*.h tests/unit/*.c tests/pager/*.c

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      CC: ${{ matrix.cc }}
      # CI runners have a pty, so a forkpty failure is a real regression, not an
      # unsupported environment — make the pager test fatal instead of skipping.
      MAT_TEST_STRICT: 1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: ./configure
      - name: Build
        run: make
      - name: Test
        run: make test

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            ./configure
            make
            MAT_TEST_STRICT=1 make test

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: ./configure
      - name: Build with ASan/UBSan
        run: make asan
      - name: Parity under sanitizers
        run: MAT="$PWD/mat-asan" sh tests/diff/parity.sh
      - name: Integration under sanitizers
        run: MAT="$PWD/mat-asan" sh tests/integration/run.sh

  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: ./configure
      - name: Build with TSan
        run: |
          $CC -std=c11 -O2 -D_GNU_SOURCE -Wall -Wextra -Wshadow -Wconversion \
            -Isrc -Ilib/paige/include -Ilib/paige/src \
            -fsanitize=thread -g -lpthread -o mat-tsan \
            $(ls src/*.c) lib/paige/src/term.c lib/paige/src/search.c lib/paige/src/pager.c
      - name: Multi-file parallel under TSan
        run: |
          ./mat-tsan --pretty --color=never src/*.c > /dev/null 2>&1
          ./mat-tsan --pretty --color=always -d src/main.c src/cli.c > /dev/null 2>&1

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install hyperfine + bat
        run: sudo apt-get update && sudo apt-get install -y hyperfine bat
      - name: Benchmark vs cat/bat
        run: sh bench/run.sh

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install hyperfine
        run: sudo apt-get update && sudo apt-get install -y hyperfine
      - name: Configure
        run: ./configure
      - name: Enforce perf gate (mat must beat cat on the fast path)
        run: sh bench/gate.sh

  all-jobs:
    if: always()
    needs: [lint, build, freebsd, sanitizers, tsan, perf]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          result='${{ join(needs.*.result, ' ') }}'
          echo "results: $result"
          for r in $result; do
            [ "$r" = "success" ] || { echo "a required job failed"; exit 1; }
          done
          echo "all required jobs passed"
